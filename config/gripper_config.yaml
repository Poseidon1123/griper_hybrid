project:
  name: griper_hybrid
  version: 0.2.0

motor:
  model: EC-A4310-P2-36
  # Set null/0 to auto-discover through CAN ID 0x7FF.
  can_id: 1
  can_baudrate: 1000000

usb_can:
  model: Waveshare USB-CAN-A
  serial_baudrate: 2000000
  serial_timeout_s: 0.03

controller:
  # PC/Windows loop; this is not hard real-time.
  loop_hz: 20.0

# Mechanical direction and travel must be calibrated on the real gripper.
gripper:
  close_direction: -1
  max_close_travel_deg: 90.0
  open_release_delta_deg: 15.0

# Normal manual/position motion.
motion:
  speed_rpm: 2.0
  current_limit_a: 0.5
  position_tolerance_deg: 0.10

# Automatic CLOSE -> CONTACT -> HOLD parameters.
grip:
  close_speed_rpm: 2.0
  i_close_a: 1.2
  i_hold_a: 0.8
  contact_current_a: 0.6
  preload_deg: 2.0
  stall_window_s: 0.30
  stall_move_deg: 0.15
  min_travel_before_contact_deg: 0.50
  min_time_before_contact_s: 0.35
  contact_confirm_count: 3

safety:
  # Software guard for the current parameters exposed by this project.
  # Increase only after validating the mechanism and thermal behavior.
  absolute_current_limit_a: 3.0
  max_motor_temp_c: 70.0
  close_timeout_s: 20.0

udp:
  enable: false
  bind_ip: 0.0.0.0
  port: 5005
