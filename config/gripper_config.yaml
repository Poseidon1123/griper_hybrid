project:
  name: "griper_hybrid"
  version: "0.1.0"

motor:
  model: "EC-A4310-P2-36"
  can_id: 1
  can_baudrate: 1000000
  protocol_verified: false

# Gripper mechanical limits. These values are initial targets and must be
# calibrated on the real mechanism before full-power operation.
gripper:
  width_min_mm: 0.0
  width_max_mm: 80.0
  default_width_mm: 80.0
  velocity_max_mm_s: 20.0
  force_max_n: 100.0

controller:
  loop_hz: 1000
  kp: 10.0
  ki: 0.0
  kd: 0.5

safety:
  position_limit_enable: true
  velocity_limit_enable: true
  torque_limit_enable: true
  communication_watchdog_enable: true
  communication_timeout_ms: 200
  require_motor_protocol_verified: true

serial:
  port: "COM5"
  baudrate: 115200
  timeout_s: 0.05

udp:
  enable: false
  bind_ip: "0.0.0.0"
  port: 5005
